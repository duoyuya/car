<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挪车通知 - 车辆通知系统</title>
  <style>
    :root {
      --primary: #007bff;
      --primary-light: #e6f0ff;
      --primary-dark: #0056b3;
      --success: #28a745;
      --danger: #dc3545;
      --text: #333;
      --text-secondary: #6c757d;
      --bg: #f8f9fa;
      --card-bg: #fff;
      --border: #dee2e6;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      transition: var(--transition);
      text-align: center;
    }
    
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
    
    .card-header {
      margin-bottom: 30px;
    }
    
    .card-header h2 {
      color: var(--primary);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .card-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    .plate-display {
      background: var(--primary-light);
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      font-size: 24px;
      font-weight: bold;
      color: var(--primary-dark);
      letter-spacing: 2px;
    }
    
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }
    
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      min-height: 80px;
      transition: var(--transition);
    }
    
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }
    
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    
    .loading {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top: 2px solid currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    
    .footer {
      margin-top: 30px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
    }
    
    .tips {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 8px;
      padding: 12px;
      margin: 20px 0;
      font-size: 13px;
      color: #856404;
    }
    
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      
      .plate-display {
        font-size: 20px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>🚗 挪车通知</h2>
      <p>请车主尽快挪车，谢谢配合</p>
    </div>
    
    <div class="plate-display" id="plateDisplay">
      正在获取车牌信息...
    </div>
    
    <div class="form-group">
      <label for="message">留言 (可选)</label>
      <textarea id="message" placeholder="您可以在这里留言，比如您的联系方式或具体情况..." maxlength="200"></textarea>
    </div>
    
    <div class="tips">
      💡 提示：点击发送后，车主将收到微信通知
    </div>
    
    <button class="btn" id="sendBtn" onclick="sendNotification()">
      <span class="loading" id="loading" style="display: none;"></span>
      <span class="text" id="btnText">📱 发送挪车通知</span>
    </button>
    
    <div class="message" id="messageDiv"></div>
    
    <div class="footer">
      车辆通知系统 © 2025 | 便捷 · 高效
    </div>
  </div>

  <script>
    let plateNumber = '';
    let plateValid = false;
    
    
    document.addEventListener('DOMContentLoaded', async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const encryptedToken = urlParams.get('token');
      const plainPlate = urlParams.get('plate'); // 兼容旧版本
      
      if (encryptedToken) {
        // 处理加密的token
        try {
          const response = await fetch('/api/decrypt-plate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ token: encryptedToken })
          });
          
          if (response.ok) {
            const data = await response.json();
            plateNumber = data.plate.replace('云M', ''); // 移除前缀，保持一致性
            document.getElementById('plateDisplay').textContent = data.plate;
            await validatePlate(plateNumber);
          } else {
            document.getElementById('plateDisplay').textContent = '无效链接';
            document.getElementById('sendBtn').disabled = true;
            showMessage('❌ 链接已失效或被篡改，请重新获取', 'error');
          }
        } catch (error) {
          document.getElementById('plateDisplay').textContent = '解析失败';
          document.getElementById('sendBtn').disabled = true;
          showMessage('❌ 链接解析失败，请检查网络连接', 'error');
        }
      } else if (plainPlate) {
        // 兼容旧版本的明文参数（逐步废弃）
        plateNumber = plainPlate;
        document.getElementById('plateDisplay').textContent = `云M${plateNumber}`;
        await validatePlate(plateNumber);
      } else {
        document.getElementById('plateDisplay').textContent = '车牌号获取失败';
        document.getElementById('sendBtn').disabled = true;
        showMessage('❌ 车牌号参数缺失，无法发送通知', 'error');
      }
    });
    
    // 验证车牌是否存在
    async function validatePlate(plate) {
      try {
        const fullPlate = `云M${plate}`;
        
        // 发送一个测试请求来验证车牌是否存在
        const response = await fetch('/api/notify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            plate: fullPlate,
            message: '__VALIDATION_CHECK__' // 特殊标记用于验证
          })
        });
        
        if (response.status === 404) {
          // 车牌不存在
          plateValid = false;
          document.getElementById('plateDisplay').textContent = `云M${plate} (无效)`;
          document.getElementById('plateDisplay').style.color = '#dc3545';
          document.getElementById('sendBtn').disabled = true;
          showMessage('❌ 该车牌号不存在于系统中，请联系管理员添加', 'error');
        } else if (response.status === 429) {
          // 请求过于频繁
          plateValid = true;
          showMessage('⚠️ 请求过于频繁，请稍后再试', 'error');
        } else if (response.status === 200) {
          // 车牌存在且验证成功
          plateValid = true;
          document.getElementById('plateDisplay').style.color = '#28a745';
        } else {
          // 其他错误状态
          plateValid = false;
          document.getElementById('plateDisplay').textContent = `云M${plate} (验证失败)`;
          document.getElementById('plateDisplay').style.color = '#dc3545';
          document.getElementById('sendBtn').disabled = true;
          showMessage('❌ 车牌验证失败，请稍后重试', 'error');
        }
      } catch (error) {
        // 网络错误，假设车牌有效但显示警告
        plateValid = true;
        showMessage('⚠️ 无法验证车牌有效性，网络连接异常', 'error');
      }
    }
    
    // 发送挪车通知
    async function sendNotification() {
      if (!plateNumber || !plateValid) {
        showMessage('❌ 车牌号无效或不存在，无法发送通知', 'error');
        return;
      }
      
      const messageText = document.getElementById('message').value.trim();
      const sendBtn = document.getElementById('sendBtn');
      const loading = document.getElementById('loading');
      const btnText = document.getElementById('btnText');
      
      // 显示加载状态
      sendBtn.disabled = true;
      loading.style.display = 'inline-block';
      btnText.textContent = '发送中...';
      
      try {
        const response = await fetch('/api/notify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            plate: `云M${plateNumber}`,
            message: messageText
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('✅ 通知发送成功！车主将收到微信提醒', 'success');
          // 清空留言框
          document.getElementById('message').value = '';
          // 3秒后重新启用按钮
          setTimeout(() => {
            sendBtn.disabled = false;
            btnText.textContent = '📱 再次发送通知';
          }, 3000);
        } else {
          showMessage(`❌ ${data.msg || '发送失败，请稍后重试'}`, 'error');
          sendBtn.disabled = false;
          btnText.textContent = '📱 发送挪车通知';
        }
      } catch (error) {
        showMessage('❌ 网络错误，请检查网络连接后重试', 'error');
        sendBtn.disabled = false;
        btnText.textContent = '📱 发送挪车通知';
      } finally {
        loading.style.display = 'none';
      }
    }
    
    // 显示消息
    function showMessage(text, type) {
      const messageDiv = document.getElementById('messageDiv');
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      
      // 5秒后自动隐藏消息
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 5000);
    }
    
    // 回车发送
    document.getElementById('message').addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        sendNotification();
      }
    });
  </script>
</body>
</html>
